<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo y Precios — PinturaPittsburgh Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="../favicon.ico">
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
    <header class="site-header">
        <div class="container site-header__bar admin-topbar">
            <p class="site-header__value-prop">PinturaPittsburgh — Panel Administrativo</p>
            <button type="button" id="admin-logout-btn" class="btn btn--gold">Cerrar sesión</button>
        </div>
    </header>

    <main class="container">
        <h1>Control de Catálogo y Precios</h1>
        <p class="brand-tagline">Actualiza precio y stock por presentación (cuarto de galón, galón, cubeta). Disponibilidad de piso de venta: Blvd. Agustín Olachea e Indeco.</p>
        <p id="catalogo-admin-status" class="brand-tagline"></p>

        <div class="table-scroll">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Volumen</th>
                        <th>SKU</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="catalogo-admin-tbody"></tbody>
            </table>
        </div>
    </main>

    <script src="../assets/js/admin-auth.js" defer></script>
    <script src="../assets/js/admin-catalogo.js" defer></script>
    <script src="../assets/js/admin-catalogo-page.js" defer></script>
</body>
</html>
