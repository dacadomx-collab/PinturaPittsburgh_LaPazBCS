name: Deploy FTP — PinturaPittsburgh_LaPazBCS (AXON_DCD CI/CD v2)
# Destino actual: Staging (pittsburgh.tourfindy.com). El servidor real, usuario,
# contraseña y ruta remota viven EXCLUSIVAMENTE en GitHub Secrets (nunca en este
# archivo) — ver knowledge/04_ARQUITECTURA_Y_BLINDAJE.md y CLAUDE.md §8 para la
# lista exacta de Secrets requeridos.

# ── TRIGGER ────────────────────────────────────────────────────────────────────
# Se activa en push a la rama principal Y a las ramas de colaboradores externos
# (Hito 19) — nunca en cualquier otra rama de feature.
# Desde el Hito 28: `collab/rafa` despliega DIRECTO a la raíz pública (mismo
# destino que `main`) por petición explícita del Arquitecto — Rafael ya es
# quien construye el frontend real y se quiere que cada push suyo se refleje
# de inmediato en https://pittsburgh.tourfindy.com/, sin esperar un PR. Esto
# NO toca el Ruleset de GitHub (`main` sigue protegida a nivel de git/PR) —
# es únicamente el destino FTP el que cambió. Contrapartida aceptada: ya no
# hay una revisión previa a que su código llegue a producción, y cualquier
# push a `main` (backend) debe traer primero lo último de `collab/rafa` antes
# de subir, o lo pisará (ambas ramas escriben a la misma raíz remota).
# `collab/moy` sigue aislada en su propia subcarpeta (ver server-dir abajo).
on:
  push:
    branches:
      - main
      - master
      - collab/rafa
      - collab/moy

# ── JOB PRINCIPAL ─────────────────────────────────────────────────────────────
jobs:
  web-deploy:
    name: Build & Deploy FTP
    runs-on: ubuntu-latest

    steps:
      # ── PASO 1: Obtener código fuente completo ───────────────────────────────
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Necesario para que FTP-Deploy calcule el diff correctamente

      # ── PASO 2 (OPCIONAL): Build de frontend (Next.js / Vite / etc.) ─────────
      # Descomentar si el proyecto tiene un paso de compilación de frontend.
      #
      # - name: Instalar Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      #
      # - name: Instalar dependencias
      #   run: npm ci
      #
      # - name: Construir frontend
      #   run: npm run build
      #
      # - name: Mover build a raíz (sin sobrescribir carpetas PHP)
      #   run: |
      #     cp -R dist/* ./   # Ajustar según la carpeta de output del bundler

      # ── PASO 3 (OPCIONAL): Instalar dependencias PHP (Composer) ──────────────
      # Descomentar si el proyecto usa Composer.
      #
      # - name: Instalar dependencias PHP
      #   run: composer install --no-dev --optimize-autoloader

      # ── NOTA (Hito 14) — Permisos de archivo en el servidor vía FTP ──────────
      # SamKirkland/FTP-Deploy-Action (protocolo FTP estándar) NO expone un
      # comando CHMOD post-subida — el protocolo FTP en sí no lo garantiza de
      # forma portable. Este pipeline NO PUEDE forzar 755/644 en el servidor.
      # Si el 403 diagnosticado en pittsburgh.tourfindy.com resulta ser un
      # problema de permisos (ver CLAUDE.md §6), la corrección debe hacerse
      # directamente en el hosting (cPanel → Administrador de Archivos →
      # Permisos, o `chmod -R 755` por SSH sobre directorios y `644` sobre
      # archivos — ver modulos/MODULO_03_CONEXION_SSH_HOSTING.md). Añadir un
      # paso SSH a este pipeline requeriría Secrets nuevos (host/usuario/llave)
      # que hoy no existen — no se inventan aquí sin autorización explícita.
      # ── PASO 4: Sincronización FTP (solo archivos cambiados, diff incremental) ─
      # NOTA: admin/, api/, workers/ y assets/ SÍ se despliegan — en particular
      # workers/instagram_worker.php debe llegar al servidor para que el cron
      # de staging pueda ejecutarlo (Hito 3, Tarea 4). Ese script queda
      # bloqueado por HTTP vía .htaccess, no por exclusión de este pipeline.
      # ── PRESERVACIÓN DE ASSETS EN PREVIEW (Hito 25) ──────────────────────────
      # Diagnóstico real (2026-09-14): las imágenes que SÍ llegaron a
      # preview-rafa/ (assets/icons/*.png) cargan perfecto (HTTP 200) — el
      # pipeline nunca excluyó ni borró formatos de imagen. La causa real de
      # "sin imágenes" en preview-rafa/ es que Rafael referencia en su HTML
      # 8 archivos (.webp/.avif) que NUNCA se agregaron a git (existen solo en
      # su disco local) — confirmado 1 a 1 contra `git ls-files` de su rama y
      # con curl directo al servidor (404 en cada uno). La solución real es
      # que Rafael haga `git add` de esos archivos y los suba — no un cambio
      # de pipeline. `dangerous-clean-slate` se deja explícito en `false` de
      # cualquier forma (identico al comportamiento por default de esta
      # acción): jamás se borra el directorio remoto completo antes de
      # subir, así que un asset subido a mano por FTP fuera de git nunca se
      # pierde en el próximo deploy tampoco.
      - name: Sincronizar archivos con servidor FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:     ${{ secrets.FTP_SERVER }}
          username:   ${{ secrets.FTP_USERNAME }}
          password:   ${{ secrets.FTP_PASSWORD }}
          dangerous-clean-slate: false
          # Solo 3 Secrets dados de alta (FTP_SERVER/USERNAME/PASSWORD) — no
          # existe FTP_REMOTE_DIR.
          #
          # CORRECCIÓN (Hito 16, 2026-09-12): la cuenta FTP de este subdominio
          # YA aterriza directamente en /home/tourfindycom/public_html/pittsburgh/
          # al iniciar sesión (confirmado por inspección visual del Arquitecto
          # en cPanel File Manager) — no en /home/tourfindycom/. El valor
          # anterior (`/public_html/pittsburgh/`) asumía que la raíz FTP era la
          # cuenta completa, y por eso cada deploy creaba una carpeta anidada
          # `pittsburgh/public_html/pittsburgh/...` en vez de escribir en la
          # raíz real del subdominio — causa confirmada del 403 (Apache no
          # encontraba index.html/.htaccess donde los buscaba). `./` = raíz de
          # donde sea que el login FTP ya aterriza, sin asumir una ruta
          # absoluta. Si el proveedor cambia el punto de montaje FTP, ajustar
          # aquí (no requiere nuevo Secret).
          #
          # MULTI-STAGE (Hito 19, ajustado Hito 28): `main`/`master` y
          # `collab/rafa` despliegan ambas a la raíz real del subdominio —
          # Rafael construye el frontend en vivo, sus push se reflejan de
          # inmediato. `collab/moy` sigue aislada en su propia subcarpeta,
          # nunca pisa la raíz:
          #   collab/rafa -> ./            -> https://pittsburgh.tourfindy.com/
          #   collab/moy  -> ./preview-moy/ -> https://pittsburgh.tourfindy.com/preview-moy/
          server-dir: ${{ github.ref_name == 'collab/moy' && './preview-moy/' || './' }}
          # Exclusiones de seguridad — NO desplegar secretos ni herramientas internas
          exclude: |
            **/.git/**
            **/.git*
            .env
            .env.*
            !.env.example
            knowledge/**
            database/**
            modulos/**
            scripts/**
            .claude/**
            logs/**
            backups/**
            backups_y_pruebas/**
            **/*.sql
            **/*.log
            **/*.md
            !README.md
            node_modules/**
            vendor/**
            **/*.zip
            **/*.rar
            **/*.bak
            info.txt
            CLAUDE.md
            AGENTS.md
